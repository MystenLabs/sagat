server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    # The load balancer adds Via, which the default (off) treats as a reason not to compress.
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # add_header in a location drops the server-level ones, so every location that sets its own includes this too.
    include /etc/nginx/snippets/headers.conf;

    # Vite's hashed output; a missing file 404s instead of falling back to index.html.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/headers.conf;
    }

    # Unhashed icons at the root revalidate.
    location ~* ^/[^/]+\.(?:svg|png|ico)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
