version: 2
updates:
  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
    # Bumped by hand with the Playwright image tag in ci.yml.
    ignore:
      - dependency-name: '@playwright/test'
    groups:
      bun-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
