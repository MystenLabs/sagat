name: Sagat CI

on:
  # Any base branch, so stacked PRs get checks too.
  pull_request:
  push:
    branches: [main, master]

# Read-only token: no job pushes, comments or publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt:check

      - name: Lint app
        run: bun lint

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      # Ignores GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6). It's only flagged for the zod 3
      # copies that @reown/appkit-wallet and @coinbase/cdp-sdk depend on. Neither
      # copy is in the app bundle, and zod 3 has no fix.
      # Remove --ignore once both packages move to zod 4.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run build
        working-directory: sdk

      - name: Typecheck SDK and API
        run: bun typecheck

      - name: Build App (typecheck)
        run: bun run build
        working-directory: app

  schema-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration snapshots
        working-directory: api
        run: bun drizzle-kit check < /dev/null

      - name: Check schema.ts matches the latest snapshot
        working-directory: api
        # stdin is closed, so a rename prompt ends the run without
        # "No schema changes" and fails the step instead of hanging.
        run: |
          set -o pipefail
          timeout 120 bun drizzle-kit generate < /dev/null 2>&1 | tee "$RUNNER_TEMP/generate.log"
          if ! grep -q "No schema changes" "$RUNNER_TEMP/generate.log"; then
            echo "::error::schema.ts differs from the latest drizzle snapshot. Run 'bun db:generate' in api/ and commit the migration."
            exit 1
          fi
          changes=$(git status --porcelain --untracked-files=all drizzle)
          if [ -n "$changes" ]; then
            echo "::error::drizzle-kit generate changed files:"
            echo "$changes"
            exit 1
          fi

  migration-test:
    name: Migration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sagat
          POSTGRES_PASSWORD: sagat
          POSTGRES_DB: sagat_test
        # TCP probe: the image's init-time server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migration tests
        run: bun test:migrations
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://sagat:sagat@localhost:5432/sagat_test

  build:
    name: Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace
        run: bun run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run app Vitest suite
        run: bun run test
        working-directory: app

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check docs content
        run: bun run test
        working-directory: docs

      - name: Build docs
        run: bun run build
        working-directory: docs

  test:
    name: API E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sagat
          POSTGRES_PASSWORD: sagat
          POSTGRES_DB: sagat_test
        # TCP probe: the image's init-time server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pin@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run build
        working-directory: sdk

      - name: Set up Sui
        uses: ./.github/actions/setup-sui

      # Since sui 1.82 the fullnode serves gRPC only, so wait on the faucet and
      # the RPC port instead of a JSON-RPC call. The script is the one the UI
      # job's Playwright harness uses.
      - name: Start Sui local network
        env:
          RUST_LOG: off
        run: |
          sh e2e/start-localnet.sh 9000 9123 &
          # Wait for network to be ready
          echo "Waiting for Sui network to start..."
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:9123/ >/dev/null && curl -s -o /dev/null http://127.0.0.1:9000/; do echo "Waiting..."; sleep 2; done'
          echo "Sui network is ready!"

      - name: Run API E2E tests
        run: bun test:e2e
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://sagat:sagat@localhost:5432/sagat_test
          JWT_SECRET: a-super-long-jwt-secret-to-use-in-the-service
          SUPPORTED_NETWORKS: localnet
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

  ui-e2e:
    name: UI E2E Tests
    # Larger runner: Playwright runs its CI workers alongside the local network, API and app.
    runs-on: ubuntu-ghcloud
    # The Playwright image ships Chromium, its system libraries and Node. Bump
    # the tag together with the @playwright/test pin in e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Inside a container job, services are reached by name, not on localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sagat
          POSTGRES_PASSWORD: sagat
          POSTGRES_DB: sagat_e2e
        # TCP probe: the image's init-time server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      # setup-bun needs unzip, which the image lacks; npm is already there.
      - name: Install Bun
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Sui
        uses: ./.github/actions/setup-sui

      # Global setup builds a Move package, which needs a client config.
      - name: Create Sui client config
        run: sui client -y envs

      # Playwright starts the local Sui network, the API and a production
      # build of the app itself (see e2e/playwright.config.ts).
      - name: Run UI E2E tests
        run: bun run test
        working-directory: e2e
        env:
          E2E_DATABASE_URL: postgresql://sagat:sagat@postgres:5432/sagat_e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
