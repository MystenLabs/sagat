name: Sagat CI

on:
  # Any base branch, so stacked PRs get checks too.
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt:check

      - name: Lint app
        run: bun lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run build
        working-directory: sdk

      - name: Typecheck SDK and API
        run: bun typecheck

      - name: Build App (typecheck)
        run: bun run build
        working-directory: app

  schema-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration snapshots
        working-directory: api
        run: bun drizzle-kit check < /dev/null

      - name: Check schema.ts matches the latest snapshot
        working-directory: api
        # stdin is closed, so a rename prompt ends the run without
        # "No schema changes" and fails the step instead of hanging.
        run: |
          set -o pipefail
          timeout 120 bun drizzle-kit generate < /dev/null 2>&1 | tee "$RUNNER_TEMP/generate.log"
          if ! grep -q "No schema changes" "$RUNNER_TEMP/generate.log"; then
            echo "::error::schema.ts differs from the latest drizzle snapshot. Run 'bun db:generate' in api/ and commit the migration."
            exit 1
          fi
          changes=$(git status --porcelain --untracked-files=all drizzle)
          if [ -n "$changes" ]; then
            echo "::error::drizzle-kit generate changed files:"
            echo "$changes"
            exit 1
          fi

  migration-test:
    name: Migration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sagat
          POSTGRES_PASSWORD: sagat
          POSTGRES_DB: sagat_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migration tests
        run: bun test:migrations
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://sagat:sagat@localhost:5432/sagat_test

  build:
    name: Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace
        run: bun run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run app Vitest suite
        run: bun run test
        working-directory: app

  test:
    name: API E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sagat
          POSTGRES_PASSWORD: sagat
          POSTGRES_DB: sagat_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run build
        working-directory: sdk

      - name: Set up Sui
        uses: ./.github/actions/setup-sui

      # Since sui 1.82 the fullnode serves gRPC only, so wait on the faucet and
      # the RPC port instead of a JSON-RPC call. The script is the one the UI
      # job's Playwright harness uses.
      - name: Start Sui local network
        env:
          RUST_LOG: off
        run: |
          export PATH="$HOME/.sui/bin:$PATH"
          sh e2e/start-localnet.sh 9000 9123 &
          # Wait for network to be ready
          echo "Waiting for Sui network to start..."
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:9123/ >/dev/null && curl -s -o /dev/null http://127.0.0.1:9000/; do echo "Waiting..."; sleep 2; done'
          echo "Sui network is ready!"

      - name: Run API E2E tests
        run: bun test:e2e
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://sagat:sagat@localhost:5432/sagat_test
          JWT_SECRET: a-super-long-jwt-secret-to-use-in-the-service
          SUPPORTED_NETWORKS: localnet
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

  ui-e2e:
    name: UI E2E Tests
    # Larger runner: Playwright runs 6 workers alongside the local network, API and app.
    runs-on: ubuntu-ghcloud
    # The Playwright image ships Chromium, its system libraries and Node. Bump
    # the tag together with the @playwright/test pin in e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Inside a container job, services are reached by name, not on localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sagat
          POSTGRES_PASSWORD: sagat
          POSTGRES_DB: sagat_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # setup-bun extracts a zip, and the image has no unzip.
      - name: Install unzip
        timeout-minutes: 2
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # suiup installs itself and sui into ~/.local/bin, which is on the hosted
      # runner's PATH but not the image's.
      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Sui
        uses: ./.github/actions/setup-sui

      # Global setup builds a Move package, which needs a client config.
      - name: Create Sui client config
        run: sui client -y envs

      # Playwright starts the local Sui network, the API and a production
      # build of the app itself (see e2e/playwright.config.ts).
      - name: Run UI E2E tests
        run: bun run test
        working-directory: e2e
        env:
          E2E_DATABASE_URL: postgresql://sagat:sagat@postgres:5432/sagat_e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
