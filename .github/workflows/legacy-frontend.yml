name: Legacy Frontend

# Runs the old frontend's e2e suite from the sagat-legacy branch against the
# API of the commit under test.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  legacy-ui-e2e:
    name: Legacy Frontend E2E Tests
    runs-on: ubuntu-ghcloud
    container:
      # Tag follows @playwright/test in sagat-legacy's e2e/package.json, not main's.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: sagat
          POSTGRES_PASSWORD: sagat
          POSTGRES_DB: sagat_e2e
        # TCP probe: the image's init-time server is socket-only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    env:
      E2E_DATABASE_URL: postgresql://sagat:sagat@postgres:5432/sagat_e2e
      E2E_SUI_RPC_URL: http://127.0.0.1:9000
      E2E_SUI_FAUCET_URL: http://127.0.0.1:9123
      E2E_API_PORT: 3100
      E2E_APP_PORT: 4173

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          path: current
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          ref: sagat-legacy
          path: legacy
          persist-credentials: false

      # setup-bun needs unzip, which the image lacks; npm is already there.
      - name: Install Bun
        run: npm install --global "$(node -p 'require("./current/package.json").packageManager')"

      # Each checkout installs from its own lockfile.
      - name: Install API dependencies
        run: bun install --frozen-lockfile
        working-directory: current

      - name: Install legacy dependencies
        run: bun install --frozen-lockfile
        working-directory: legacy

      - name: Build SDKs
        run: |
          (cd current/sdk && bun run build)
          (cd legacy/sdk && bun run build)

      - name: Set up Sui
        uses: ./current/.github/actions/setup-sui

      # Global setup builds a Move package, which needs a client config.
      - name: Create Sui client config
        run: sui client -y envs

      - name: Start Sui local network
        working-directory: legacy
        env:
          RUST_LOG: off
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          nohup sh e2e/start-localnet.sh 9000 9123 > "$GITHUB_WORKSPACE/logs/sui.log" 2>&1 &
          timeout 120 bash -c 'until curl -sf "$E2E_SUI_FAUCET_URL/" >/dev/null && curl -s -o /dev/null "$E2E_SUI_RPC_URL/"; do sleep 2; done'

      # Same environment the legacy Playwright config gives its API server.
      - name: Start API
        working-directory: current/api
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          JWT_SECRET: e2e-jwt-secret-that-is-only-used-by-tests
          SUPPORTED_NETWORKS: localnet
          CORS_ALLOWED_ORIGINS: http://localhost:${{ env.E2E_APP_PORT }}
          PORT: ${{ env.E2E_API_PORT }}
          SUI_RPC_URL_localnet: ${{ env.E2E_SUI_RPC_URL }}
        run: |
          bun run db:prepare
          nohup bun run src/index.ts > "$GITHUB_WORKSPACE/logs/api.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf "http://localhost:$PORT/health" >/dev/null; do sleep 1; done'

      # Without CI, Playwright reuses the network and API started above and
      # still builds and serves the old app. The flags restore CI's workers,
      # retries, forbid-only and reporters.
      - name: Run legacy UI E2E tests
        working-directory: legacy/e2e
        env:
          E2E_APP_SERVER: preview
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          # Leaves Playwright no legacy API to fall back on.
          rm -rf "$GITHUB_WORKSPACE/legacy/api"
          unset CI
          bun run test --workers=6 --retries=1 --forbid-only --reporter=github,list,html

      - name: Print API log
        if: ${{ failure() }}
        run: cat logs/api.log

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7.0.2
        with:
          name: legacy-playwright-report
          path: |
            legacy/e2e/playwright-report
            legacy/e2e/test-results
            logs
          retention-days: 14
